<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบ · MASARU Branding</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <button class="mobile-btn" id="mobileBtn">☰</button>
      <div><h1 id="sysName">—</h1><div class="sub" id="sysDesc">—</div></div>
      <div class="spacer"></div>
      <a class="btn ghost sm" href="index.html">← หน้าหลักทุกระบบ</a>
    </div>

    <div class="content">
      <div class="sect-title" style="margin-bottom:12px">เมนูในระบบนี้ <span id="menuCount"></span></div>
      <div class="hub-grid" id="menuGrid"></div>

      <div id="quickBox" style="margin-top:26px"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.39.7/umd/supabase.min.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  'use strict';
  var $=function(id){ return document.getElementById(id); };

  function kpiCard(cls,label,value,foot,bar){
    return '<div class="kpi '+cls+'"><div class="lb">'+label+'</div><div class="vl">'+value+'</div>'+
      (foot?'<div class="ft">'+foot+'</div>':'')+
      (bar!=null?'<div class="progress"><i style="width:'+Math.min(100,bar).toFixed(0)+'%"></i></div>':'')+'</div>';
  }

  /* สรุปย่อประจำระบบ — เลือกตามชนิดของระบบที่เปิดอยู่ */
  async function quickStats(code){
    var box=$('quickBox'), r=MB.presetRange('mtd');
    try{
      if(code==='SALES'){
        var k=await MB.rpc('brand_kpi',{p_from:r[0],p_to:r[1],p_platform:'ALL',p_brand:'ALL'});
        var ach=k.target>0?k.gmv/k.target*100:0;
        var aov=k.orders>0?k.gmv/k.orders:0;
        box.innerHTML='<div class="sect-title">สรุปเดือนนี้</div><div class="grid kpi-row">'+
          kpiCard('navy','Total GMV',MB.fmt.baht(k.gmv),MB.fmt.n(k.qty)+' ชิ้น')+
          kpiCard('gold','Achievement',k.target>0?MB.fmt.pct(ach):'—',
                  k.target>0?'เป้า '+MB.fmt.baht(k.target):'ยังไม่ตั้งเป้า',k.target>0?ach:null)+
          kpiCard('','Orders',MB.fmt.n(k.orders),'ยกเลิก '+MB.fmt.n(k.cancelled))+
          kpiCard('green','AOV',MB.fmt.baht(aov),'ต่อออเดอร์')+
          '</div>';
      } else if(code==='CREATOR'){
        var rows=await MB.rpc('brand_creator_rank',{p_from:r[0],p_to:r[1],p_type:'ALL',p_limit:10});
        rows=rows||[];
        var g=0,v=0,l=0,bl=0;
        rows.forEach(function(x){ g+=Number(x.gmv)||0; v+=Number(x.gmv_vdo)||0;
          l+=Number(x.gmv_live)||0; if(x.blacklisted) bl++; });
        box.innerHTML='<div class="sect-title">สรุปเดือนนี้ (Top 10)</div><div class="grid kpi-row">'+
          kpiCard('navy','GMV จากครีเอเตอร์',MB.fmt.baht(g),'จากครีเอเตอร์ '+rows.length+' คน')+
          kpiCard('','ยอดจาก VDO',MB.fmt.baht(v),g?MB.fmt.pct(v/g*100):'-')+
          kpiCard('red','ยอดจาก LIVE',MB.fmt.baht(l),g?MB.fmt.pct(l/g*100):'-')+
          kpiCard('gold','อยู่ใน Blacklist',MB.fmt.n(bl)+' คน','จาก Top 10')+
          '</div>';
      } else if(code==='DATA'){
        var res=await MB.sb.from('brand_import_logs').select('*')
                  .order('created_at',{ascending:false}).limit(6);
        var rows2=res.data||[];
        var h='<div class="sect-title">การนำเข้าข้อมูลล่าสุด</div><div class="card"><div class="tbl-wrap">'+
              '<table class="tbl"><thead><tr><th>ไฟล์</th><th>ประเภท</th><th class="num">แถวที่เข้า</th>'+
              '<th>โดย</th><th>เวลา</th><th>สถานะ</th></tr></thead><tbody>';
        if(!rows2.length) h+='<tr><td colspan="6"><div class="empty">ยังไม่มีประวัติการนำเข้า</div></td></tr>';
        rows2.forEach(function(x){
          h+='<tr><td>'+MB.esc(x.file_name||'-')+'</td>'+
             '<td><span class="pill mute">'+MB.esc(x.source||'-')+'</span></td>'+
             '<td class="num">'+MB.fmt.n(x.rows_inserted)+'</td>'+
             '<td>'+MB.esc(x.imported_by||'-')+'</td>'+
             '<td>'+MB.fmt.dt(x.created_at)+'</td>'+
             '<td><span class="pill '+(x.status==='SUCCESS'?'up':'down')+'">'+MB.esc(x.status)+'</span></td></tr>';
        });
        h+='</tbody></table></div></div>';
        box.innerHTML=h;
      }
    }catch(e){ box.innerHTML=''; }
  }

  (async function(){
    var s=await MB.guard(); if(!s) return;

    var code=new URLSearchParams(location.search).get('code');
    var row=code ? MB.state.menu.find(function(x){ return x.code===code; }) : null;

    if(!row || row.parent_code){
      document.querySelector('.content').innerHTML=
        '<div class="card"><div class="bd"><div class="insight bad"><div class="ic">🔒</div><div>'+
        '<b>ไม่พบระบบนี้ หรือคุณไม่มีสิทธิ์เข้าถึง</b>'+
        '<span>ตำแหน่ง "'+MB.esc(MB.state.roleName)+'" ยังไม่ได้รับสิทธิ์ในระบบนี้ — ติดต่อผู้ดูแลระบบ</span>'+
        '</div></div><a class="btn" href="index.html" style="margin-top:12px">← กลับหน้าหลัก</a></div></div>';
      MB.renderShell();
      return;
    }

    document.title=row.name+' · MASARU Branding';
    $('sysName').textContent=row.name;
    $('sysDesc').textContent=row.description||'';
    MB.renderShell(row.code);

    var kids=MB.state.childrenOf[row.code]||[];
    $('menuCount').textContent = kids.length ? '· '+kids.length+' เมนู' : '';
    $('menuGrid').innerHTML = kids.length
      ? kids.map(function(k){
          return '<a class="hub-card '+MB.esc(k.color||'c1')+'" href="'+MB.esc(MB.linkOf(k))+'">'+
            '<div class="ico">'+MB.esc(k.icon||'▦')+'</div>'+
            '<h3>'+MB.esc(k.name)+'</h3>'+
            '<p>'+MB.esc(k.description||'')+'</p>'+
            '<div class="go">เข้าใช้งาน →</div></a>';
        }).join('')
      : '<div class="card" style="grid-column:1/-1"><div class="bd"><div class="empty">'+
        'ระบบนี้ยังไม่มีเมนูย่อยที่คุณเข้าถึงได้</div></div></div>';

    quickStats(row.code);
  })();
})();
</script>
</body>
</html>
