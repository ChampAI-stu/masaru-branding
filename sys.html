<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ระบบ · MASARU Branding</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/boot.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="boot" id="bootScreen">
  <div class="spinner"></div><div>กำลังเปิดระบบ…</div>
</div>

<div class="hide" id="sysScreen">
  <header class="top">
    <div class="wordmark"><div class="mark">M</div><b>MASARU</b></div>
    <div class="hdr-label" id="hdrLabel">—</div>
    <div class="spacer"></div>
    <span class="role-pill" id="rolePill">—</span>
    <a class="hdr-btn" href="index.html"><i class="ti ti-arrow-back-up"></i> หน้าหลักทุกระบบ</a>
    <button class="logout" id="btnOut"><i class="ti ti-logout"></i> ออกจากระบบ</button>
  </header>

  <main>
    <div class="hub-title" id="sysName">—</div>
    <div class="hub-sub" id="sysDesc">—</div>

    <div class="app-grid" id="menuGrid"></div>

    <div id="quickBox" style="margin-top:34px"></div>

    <footer>MASARU Powertools · <span class="tag">Branding Portal</span></footer>
  </main>
</div>

<script src="assets/app.js"></script>
<script>if(window.__boot && !window.__bootCheckLibs()) throw new Error("boot-halt");</script>
<script>
(function(){
  'use strict';
  if(!window.MB) return;
  var $=function(id){ return document.getElementById(id); };
  var ic=function(n){ return '<i class="ti '+MB.esc(n||'ti-apps')+'"></i>'; };

  function tile(r,accent){
    var url=MB.linkOf(r);
    return '<div class="app-tile'+(accent?' accent':'')+'" data-url="'+MB.esc(url)+'">'+
      '<div class="app-icon">'+ic(r.icon)+'</div>'+
      '<div class="app-name">'+MB.esc(r.name)+'</div>'+
      '<div class="app-desc">'+MB.esc(r.description||'')+'</div>'+
      '<div class="app-go">เข้าใช้งาน '+ic('ti-arrow-right')+
        '<span class="app-newtab" data-url="'+MB.esc(url)+'" title="เปิดในแท็บใหม่">'+
        ic('ti-external-link')+' แท็บใหม่</span></div></div>';
  }
  function bind(box){
    box.querySelectorAll('.app-newtab').forEach(function(b){
      b.onclick=function(e){ e.stopPropagation(); window.open(b.dataset.url,'_blank'); };
    });
    box.querySelectorAll('.app-tile').forEach(function(t){
      t.onclick=function(){ location.href=t.dataset.url; };
    });
  }

  function kpi(cls,lb,vl,ft,bar){
    return '<div class="kpi '+cls+'"><div class="lb">'+lb+'</div><div class="vl">'+vl+'</div>'+
      (ft?'<div class="ft">'+ft+'</div>':'')+
      (bar!=null?'<div class="progress"><i style="width:'+Math.min(100,bar).toFixed(0)+'%"></i></div>':'')+'</div>';
  }

  /* สรุปย่อประจำระบบ */
  async function quick(code){
    var box=$('quickBox'), r=MB.presetRange('mtd');
    try{
      if(code==='SALES'){
        var k=await MB.rpc('brand_kpi',{p_from:r[0],p_to:r[1],p_platform:'ALL',p_brand:'ALL'});
        var ach=k.target>0?k.gmv/k.target*100:0, aov=k.orders>0?k.gmv/k.orders:0;
        box.innerHTML='<div class="sect-title">สรุปเดือนนี้</div><div class="grid kpi-row">'+
          kpi('navy','Total GMV',MB.fmt.baht(k.gmv),MB.fmt.n(k.qty)+' ชิ้น')+
          kpi('gold','Achievement',k.target>0?MB.fmt.pct(ach):'—',
              k.target>0?'เป้า '+MB.fmt.baht(k.target):'ยังไม่ตั้งเป้า',k.target>0?ach:null)+
          kpi('','Orders',MB.fmt.n(k.orders),'ยกเลิก '+MB.fmt.n(k.cancelled))+
          kpi('green','AOV',MB.fmt.baht(aov),'ต่อออเดอร์')+'</div>';
      } else if(code==='CREATOR'){
        var rows=await MB.rpc('brand_creator_rank',{p_from:r[0],p_to:r[1],p_type:'ALL',p_limit:10});
        rows=rows||[];
        var g=0,v=0,l=0,bl=0;
        rows.forEach(function(x){ g+=Number(x.gmv)||0; v+=Number(x.gmv_vdo)||0;
          l+=Number(x.gmv_live)||0; if(x.blacklisted) bl++; });
        box.innerHTML='<div class="sect-title">สรุปเดือนนี้ (Top 10)</div><div class="grid kpi-row">'+
          kpi('navy','GMV จากครีเอเตอร์',MB.fmt.baht(g),'จาก '+rows.length+' คน')+
          kpi('','ยอดจาก VDO',MB.fmt.baht(v),g?MB.fmt.pct(v/g*100):'-')+
          kpi('red','ยอดจาก LIVE',MB.fmt.baht(l),g?MB.fmt.pct(l/g*100):'-')+
          kpi('gold','อยู่ใน Blacklist',MB.fmt.n(bl)+' คน','จาก Top 10')+'</div>';
      } else if(code==='DATA'){
        var res=await MB.sb.from('brand_import_logs').select('*')
                  .order('created_at',{ascending:false}).limit(6);
        var rr=res.data||[];
        var h='<div class="sect-title">การนำเข้าข้อมูลล่าสุด</div><div class="card"><div class="tbl-wrap">'+
          '<table class="tbl"><thead><tr><th>ไฟล์</th><th>ประเภท</th><th class="num">แถวที่เข้า</th>'+
          '<th>โดย</th><th>เวลา</th><th>สถานะ</th></tr></thead><tbody>';
        if(!rr.length) h+='<tr><td colspan="6"><div class="empty">ยังไม่มีประวัติการนำเข้า</div></td></tr>';
        rr.forEach(function(x){
          h+='<tr><td>'+MB.esc(x.file_name||'-')+'</td>'+
             '<td><span class="pill mute">'+MB.esc(x.source||'-')+'</span></td>'+
             '<td class="num">'+MB.fmt.n(x.rows_inserted)+'</td>'+
             '<td>'+MB.esc(x.imported_by||'-')+'</td>'+
             '<td>'+MB.fmt.dt(x.created_at)+'</td>'+
             '<td><span class="pill '+(x.status==='SUCCESS'?'up':'down')+'">'+MB.esc(x.status)+'</span></td></tr>';
        });
        box.innerHTML=h+'</tbody></table></div></div>';
      }
    }catch(e){ box.innerHTML=''; }
  }

  (async function(){
    var s=await MB.guard(); if(!s) return;
    if(window.__boot) window.__boot.ok();

    var code=new URLSearchParams(location.search).get('code');
    var row=code ? MB.state.menu.find(function(x){ return x.code===code; }) : null;

    $('bootScreen').classList.add('hide');
    $('sysScreen').classList.remove('hide');
    $('rolePill').textContent='ตำแหน่ง: '+(MB.state.roleName||MB.state.role);
    $('btnOut').onclick=MB.signOut;

    if(!row || row.parent_code){
      $('hdrLabel').textContent='ไม่พบระบบ';
      $('sysName').textContent='ไม่พบระบบนี้ หรือคุณไม่มีสิทธิ์เข้าถึง';
      $('sysDesc').textContent='ตำแหน่ง "'+MB.state.roleName+'" ยังไม่ได้รับสิทธิ์ในระบบนี้ — ติดต่อผู้ดูแลระบบ';
      $('menuGrid').innerHTML='<div class="empty-apps"><a class="link" href="index.html">← กลับหน้าหลักทุกระบบ</a></div>';
      return;
    }

    document.title=row.name+' · MASARU Branding';
    $('hdrLabel').textContent=row.name;
    $('sysName').textContent=row.name;
    $('sysDesc').textContent=row.description||'';

    var kids=MB.state.childrenOf[row.code]||[];
    $('menuGrid').innerHTML = kids.length
      ? kids.map(function(k){ return tile(k, k.color==='c3'); }).join('')
      : '<div class="empty-apps">ระบบนี้ยังไม่มีเมนูย่อยที่คุณเข้าถึงได้</div>';
    bind($('menuGrid'));

    quick(row.code);
  })();
})();
</script>
</body>
</html>
